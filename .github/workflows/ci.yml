name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  uji:
    name: Build & uji end-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Sekaligus memeriksa TypeScript: `npm run build` menjalankan `tsc -b` lebih dulu.
      - name: Build
        run: npm run build

      # Chromium-nya diunduh setiap kali; ~30 detik, jauh lebih murah daripada
      # cache yang basi saat versi Playwright naik.
      - name: Pasang browser
        run: npx playwright install --with-deps chromium

      - name: Uji end-to-end
        run: npm test

      # Hanya saat gagal — isinya jejak dan tangkapan layar untuk menelusuri sebabnya.
      - name: Simpan laporan bila gagal
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
